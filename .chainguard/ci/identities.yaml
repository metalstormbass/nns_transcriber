version: 1

# Workload identity: lets specific checks pull Python packages through
# Chainguard Libraries (libraries.cgr.dev) with no credential in the VM —
# the platform injects it on requests to the listed host.
identities:
  libraries-pull:
    description: Pull Python deps through Chainguard Libraries (CHAINGUARD_AND_UPSTREAM).
    checks:
      - tests.checks.deps
      - tests.checks.smoke
      - release.checks.deep-audit
    audiences:
      - libraries.cgr.dev
    allow:
      - run: presubmit
        target_ref: refs/heads/main
    chainguard:
      libraries.cgr.dev:
        identity: a8cae4933a02f321aab564b94317461940499c01/c804ad57f6f30ec1
        exchange_audience: libraries.cgr.dev
        role: libraries.python.pull
        # Scope the exchanged token to the mikeco.com org
        scopes: [a8cae4933a02f321aab564b94317461940499c01]
    # NOTE: no trust section for now — with the identity granted by the
    # allow rules alone, every open PR targeting main (including forks)
    # can use it. Acceptable here because the role is read-only package
    # pulls. Re-add a trust block with rings once the beta supports it
    # for this repo (a trust section with the required github_token key
    # was rejected at exchange time with "base identity does not
    # configure GitHub credentials").
